[package]
name = "kistelen-macros"
description = "Derive macro implementation for the kistelen crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../README.md"

[lib]
proc-macro = true

[features]
# Enabled through `kistelen/regex`, never directly.
regex = ["dep:regex-syntax"]

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }
# Parses patterns to validate them at expansion time without building a
# matcher, which is all the macro needs.
regex-syntax = { version = "0.8", optional = true }
